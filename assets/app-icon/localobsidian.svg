<?xml version="1.0" encoding="UTF-8"?>
<!--
  Local Obsidian icon: a note page with a markdown `#` knocked out of it, on the suite's tile.

  Language of the family: full-bleed 512 tile (32..480, rx 100), diagonal gradient with a top
  sheen, one white glyph at ~70% of the tile, "Taylor" signature at the bottom. Hue: violet-indigo
  (#746af0 -> #3730a3) - the only strong hue the suite does not use yet (paint amber, slides
  orange, pdf red, sheets emerald, vector teal, photo fuchsia, office blue), and the one that reads
  as "notes" without copying anyone's brand. The light stop sits 5-8 degrees towards violet on
  purpose: it is what keeps this icon apart from Local Word's blue at 16 px.

  The `#` is a mask, not a dark shape, so the tile's gradient shows through it and the icon has
  one flat colour plus the page. `packaging/icons.sh` rasterises this file for every size of 40 px
  and up; `localobsidian-small.svg` (same art, thicker `#`) covers 16-32 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#746af0"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- White page, minus the markdown `#`. The `#` is centred in the page: its box runs from
         y=186 to y=326, the page from 96 to 416. -->
    <mask id="page">
      <path d="M142 124 C142 108 155 96 171 96 L312 96 L370 154 L370 388 C370 404 357 416 341 416 L171 416 C155 416 142 404 142 388 Z"
            fill="#ffffff"/>
      <g stroke="#000000" stroke-width="30" stroke-linecap="round">
        <line x1="200" y1="224" x2="322" y2="224"/>
        <line x1="196" y1="288" x2="318" y2="288"/>
        <line x1="247" y1="186" x2="233" y2="326"/>
        <line x1="295" y1="186" x2="281" y2="326"/>
      </g>
    </mask>
  </defs>

  <!-- tile -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="256" rx="100" fill="url(#sheen)"/>

  <!-- the note -->
  <rect x="142" y="96" width="228" height="320" rx="28" fill="#ffffff" mask="url(#page)"/>
  <!-- folded corner, a shade of the tile so the fold reads as paper -->
  <path d="M312 96 L370 154 L312 154 Z" fill="#c7d2fe" opacity="0.92"/>

  <!-- brand signature -->
  <text x="256" y="462" font-family="Segoe Script, cursive" font-size="42"
        fill="#ffffff" opacity="0.85" text-anchor="middle">Taylor</text>
</svg>
