<?xml version="1.0" encoding="UTF-8"?>
<!--
  Local Obsidian icon, small-size variant: the same tile, page and signature as
  `localobsidian.svg`, with the `#` drawn bolder and slightly wider.

  Why it exists: at 16 px the thin `#` of the master lands under one pixel per stroke and reads as
  a page with lines of text - which is exactly Local Word's mark. A heavier, wider `#` keeps the
  two apart at the sizes where the icons actually compete (taskbar, Start menu, file manager).

  Used by `packaging/icons.sh` for 16, 20, 24 and 32 px only; 40 px and up come from the master.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#746af0"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Same page, a `#` with ~40% more stroke and wider spacing, so the four strokes stay apart
         once the whole icon is one sixteenth of its size. -->
    <mask id="page">
      <path d="M142 124 C142 108 155 96 171 96 L312 96 L370 154 L370 388 C370 404 357 416 341 416 L171 416 C155 416 142 404 142 388 Z"
            fill="#ffffff"/>
      <g stroke="#000000" stroke-width="36" stroke-linecap="round">
        <line x1="176" y1="222" x2="336" y2="222"/>
        <line x1="176" y1="290" x2="336" y2="290"/>
        <line x1="233" y1="180" x2="219" y2="332"/>
        <line x1="303" y1="180" x2="289" y2="332"/>
      </g>
    </mask>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="256" rx="100" fill="url(#sheen)"/>

  <rect x="142" y="96" width="228" height="320" rx="28" fill="#ffffff" mask="url(#page)"/>
  <path d="M312 96 L370 154 L312 154 Z" fill="#c7d2fe" opacity="0.92"/>

  <text x="256" y="462" font-family="Segoe Script, cursive" font-size="42"
        fill="#ffffff" opacity="0.85" text-anchor="middle">Taylor</text>
</svg>
