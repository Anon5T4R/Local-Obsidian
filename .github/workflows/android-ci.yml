name: Android CI

on:
  push:
    # Só a main: tag não dispara o CI (o android-release.yml cuida da release).
    branches: ["main"]
    paths: ["android/**", ".github/workflows/android-*.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-*.yml"]
  workflow_dispatch:

# O app Android mora em android/.
defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Os testes primeiro: se a lógica pura quebrou, não interessa se o APK sai.
      - name: Testes unitários
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
