[workspace]
resolver = "3"
members = ["crates/*", "apps/localobsidian", "xtask"]
exclude = ["libs"]
default-members = ["crates/*", "apps/localobsidian", "xtask"]

[workspace.package]
version = "1.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
# Nada da suíte vai ao crates.io: dependência `path` sem versão numa crate publicável reprova o
# `cargo-deny` (wildcards). Cada membro herda com `publish.workspace = true`.
publish = false
repository = "https://github.com/Anon5T4R/Local-Obsidian"

[workspace.dependencies]
# Vendored craft libs (libs/craft-libs). `crates/update` comes from the suite's single source,
# Anon5T4R/local-libs: the copy here is a mirror, never edited in place.
# Not wired while nothing uses them (an unused workspace dependency is a cargo warning):
# `craft-ui` (widgets/icons/theme). Add the line back when the first crate needs it.
# The suite's icons for shared concepts (theme, settings, help, AI...) and the theme button. Source: local-libs.
craft-icons = { path = "libs/craft-libs/crates/icons/", features = ["egui"] }
# The suite's command palette (Ctrl+K and the search icon). Source: local-libs.
craft-palette = { path = "libs/craft-libs/crates/palette/" }
# Agent-native plumbing (stdio MCP server, script steps with "$N", the automation roots and the
# `--connect PORT` live bridge); source in local-libs, mirrored here by its sync.ps1.
craft-mcp = { path = "libs/craft-libs/crates/mcp/" }
craft-i18n = { path = "libs/craft-libs/crates/i18n/" }
craft-ai-ui = { path = "libs/craft-libs/crates/ai-ui/" }
# The SVG loader for the suite's icons (craft-icons): resvg, pure Rust. Vendored fork via [patch].
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
craft-pdf = { path = "libs/craft-libs/crates/pdf/" }
# egui's bundled Latin faces: what the PDF export embeds (the app ships no other Latin pair).
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
craft-update = { version = "=0.1.0", path = "libs/craft-libs/crates/update/", features = ["egui", "icons"] }
# Glyph ids and advances for the PDF export (the egui fork already shapes with it).
skrifa = { version = "0.44", default-features = false, features = ["std"] }
craft-window = { path = "libs/craft-libs/crates/window/", features = ["egui"] }
# Linux: the desktop's light/dark choice reaches `ctx.system_theme()` (winit reports none there);
# source of truth in local-libs, vendored here and replicated by its sync.ps1.
craft-desktop-theme = { path = "libs/craft-libs/crates/desktop-theme/" }
# BYOK AI: the suite's shared client (libs/local-ai), the same one local-office and local-pdf vendor.
local-ai = { path = "libs/local-ai" }

# the app's own layers (crates/localobsidian-*)
localobsidian-ai = { path = "crates/ai" }
localobsidian-convert = { path = "crates/convert" }
localobsidian-editor = { path = "crates/editor" }
localobsidian-md = { path = "crates/md" }
localobsidian-pdf = { path = "crates/pdf" }
localobsidian-review = { path = "crates/review" }
localobsidian-vault = { path = "crates/vault" }

# note format
# Markdown -> the preview's block model. Parser only (`html`/`getopts` are CLI/HTML output).
pulldown-cmark = { version = "0.13", default-features = false }
# YAML 1.2 for the frontmatter block; pure Rust, no C. `encoding` off: notes are UTF-8 by contract.
saphyr = { version = "0.3", default-features = false }
# The search panel's `.*` toggle. Pure Rust; already in the suite (local-sheets).
regex = "1"
# Decoding the pictures a note shows. No C: every format listed here is pure Rust.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# An .odt/.docx is a ZIP of XML: `zip` (already in the tree via craft-update) and `quick-xml`, both
# pure Rust. Only `deflate` is needed - office documents never compress with zstd/bzip2.
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
# Watching the vault folder (pure-Rust bindings to ReadDirectoryChangesW/inotify/kqueue).
notify = "8"
# Headless UI tests (egui_kittest): the panels render, list what they should and answer clicks.
egui_kittest = { version = "0.37", default-features = false, features = ["wgpu"] }
# Calendar days for the flashcard schedule and the daily-note calendar. Pure Rust; already in the
# tree (craft-update). `clock` brings the local time zone, which is what "due today" means.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# foundation
log = "0.4"
serde_json = { version = "1", features = ["float_roundtrip"] }

# ui
# 0.37: `default_fonts` is no longer an egui default and the monochrome emoji faces moved behind
# `monochrome_emoji_fonts`. Every resolution root (native, kittest, wasm) needs both.
egui = { version = "0.37", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false }
# Native file dialogs: defaults on purpose (Linux gets the XDG portal through zbus, pure Rust;
# never `default-features = false` - the mold is local-pdf, see the docs in `src/pickers.rs`).
rfd = "0.17"
pollster = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = false

# The egui family and winit are vendored forks under libs/ (path sources: egui
# 6d518fc799681571963842f95b55a6b68431b15a, winit a517b3846ee8457d84ee4975110bfda6797c44dc).
# rustls-rustcrypto is the suite's fork (libs/rustls-rustcrypto) that the vendored craft-update
# pins: the upstream alpha still pulls rustls-webpki 0.102 for `alg_id` alone.
[patch.crates-io]
# The suite's PDF backend fork (craft-pdf's write feature asserts on it).
krilla = { path = "libs/craft-libs/vendor/krilla/" }
ecolor = { path = "libs/egui/crates/ecolor/" }
emath = { path = "libs/egui/crates/emath/" }
epaint = { path = "libs/egui/crates/epaint/" }
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
egui = { path = "libs/egui/crates/egui/" }
egui-winit = { path = "libs/egui/crates/egui-winit/" }
egui-wgpu = { path = "libs/egui/crates/egui-wgpu/" }
egui_glow = { path = "libs/egui/crates/egui_glow/" }
egui_extras = { path = "libs/egui/crates/egui_extras/" }
egui_kittest = { path = "libs/egui/crates/egui_kittest/" }
egui_system_font_provider = { path = "libs/egui/crates/egui_system_font_provider/" }
eframe = { path = "libs/egui/crates/eframe/" }
egui_demo_lib = { path = "libs/egui/crates/egui_demo_lib/" }
egui_inspection = { path = "libs/egui/crates/egui_inspection/" }
winit = { path = "libs/winit/" }
rustls-rustcrypto = { path = "libs/rustls-rustcrypto" }
