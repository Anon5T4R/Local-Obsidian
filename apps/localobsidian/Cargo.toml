[package]
name = "localobsidian"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Local Obsidian - notes, wikilinks and attachments in a plain folder (egui)"
default-run = "localobsidian"

[lints]
workspace = true

[dependencies]
craft-i18n = { workspace = true }
craft-ai-ui = { workspace = true }
craft-update = { workspace = true }
craft-window = { workspace = true }
craft-desktop-theme = { workspace = true }
# Calendar days for the note calendar and the template placeholders.
chrono = { workspace = true }
localobsidian-editor = { workspace = true }
localobsidian-ai = { workspace = true }
localobsidian-convert = { workspace = true }
localobsidian-md = { workspace = true }
localobsidian-pdf = { workspace = true }
epaint_default_fonts = { workspace = true }
localobsidian-review = { workspace = true }
localobsidian-vault = { workspace = true }
# `clipboard` is a separate eframe feature in 0.37: without it egui-winit simulates an in-process
# clipboard and cut/copy/paste, RequestPaste and the Wayland PRIMARY path are unavailable.
eframe = { workspace = true, features = ["default_fonts", "clipboard", "wgpu", "glow", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
# Decoding the pictures a note shows (`![[foto.png]]`); craft-update already pulls `image` in for
# the app icon, so these features cost no new package.
image = { workspace = true }
log = { workspace = true }
notify = { workspace = true }
pollster = { workspace = true }
rfd = { workspace = true }
# The settings file (`prefs.json`): plain JSON, no derive, no schema to keep in sync.
serde_json = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for localobsidian.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[dev-dependencies]
# The panels are drawn headlessly by the tests (accessibility tree for the assertions, a PNG of the
# screen when `LOCALOBSIDIAN_QA_RENDER=1`).
egui_kittest = { workspace = true, features = ["wgpu"] }
